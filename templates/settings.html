{% extends 'layout.html' %}

{% block title %}
    Settings
{% endblock %}

{% block main %}
    <h1 class='display-1 mb-5'>Settings</h1>
    {% if not login %}
        <div style='display:grid; grid-template-columns:repeat(3, 1fr);align-items:start'>
            <form  action='/settings' method='post' style='grid-column:1;'>
                <h5 class='mb-2'>Change your username:</h5>
                <div class="mb-2">
                    <input autocomplete='off' class="form-control mx-auto w-auto" name="username" placeholder="New Username" type="text">
                </div>
                <button class="btn btn-info mb-3" type="submit">Set</button>
            </form>
            <form action='/settings' method='post' style='grid-column:1;'>
                <h5 class='mb-2'>Change your password:</h5>
                <div class="mb-2">
                    <input autocomplete='off' class="form-control mx-auto w-auto" name="password" placeholder="New Password" type="password">
                </div>
                <div class="mb-2">
                    <input autocomplete='off' class="form-control mx-auto w-auto" name="confirmation" placeholder="Retype Password" type="password">
                </div>
                <button class="btn btn-info" type="submit">Set</button>
            </form>
            <form action='/logout' method='post' style='grid-column:2;grid-row:1;'>
                <button class="btn btn-info my-4" type="submit">Log out</button>
            </form>
            <form action='/settings' method='post' style='grid-column:2;grid-row:2;'>
                <h5 class='mb-2'>Delete account:</h5>
                <input autocomplete='off' class='form-control mx-auto w-auto mb-2' name='delete_acc' placeholder="Type 'DELETE'" type='text'>
                <button class="btn btn-info" type="submit">Confirm</button>
            </form>
            <form action='/settings' method='post' style='grid-column:3; grid-row:1 / 3'>
                <h5 class='mb-2'>Report a bug:</h5>
                <input autocomplete='off' class='form-control mx-auto w-auto mb-2' name='bug_report' placeholder='Input the details here' type='text' style='height:100%;'>
                <button class="btn btn-info" type="submit">Submit</button>
            </form>
        </div>
    {% else %}
        <form action='/settings' method='post'>
            <h5 class='mb-2'>Report a bug:</h5>
            <input autofocus autocomplete='off' class='form-control mx-auto w-auto mb-2' name='bug_report' placeholder='Input the details here' type='text' style='height:100%;'>
            <button class="btn btn-info" type="submit">Submit</button>
        </form>
    {% endif %}
{% endblock %}
