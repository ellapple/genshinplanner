{% extends 'layout.html' %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <h1 class="display-3 mb-5">Register</h1>
    <form action='/register' method='post'>
        <input autocomplete='off' autofocus class='form-control mx-auto w-auto mb-3' name='username' placeholder='Username' type='text'>
        <input autocomplete='off' autofocus class='form-control mx-auto w-auto mb-3' name='password' placeholder='Password' type='password'>
        <input autocomplete='off' autofocus class='form-control mx-auto w-auto mb-3' name='confirmation' placeholder='Retype Password' type='password'>
        <button class='btn btn-info' type='submit'>Register</button>
        <div>
        <a href='/login' class="form-text">Log in</a>
        </div>
    </form>
{% endblock %}
